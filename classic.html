<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shanghai 2026 | 摩登手冊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .glass-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); }
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body x-data="travelApp()">
    <!-- VERSION SWITCHER -->
    <div style="background:#1E3A6E;color:#fff;font-size:11px;text-align:center;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:12px">
      <span>📋 原始版 V1 · 經典深色版</span>
      <a href="index.html" style="color:#F5D789;text-decoration:none;font-weight:700;border:1px solid rgba(245,215,137,.5);border-radius:20px;padding:2px 10px">切換 V2 研究強化版 →</a>
    </div>
    <header class="glass-header text-white p-6 sticky top-0 z-50 rounded-b-[2.5rem] shadow-2xl">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-blue-400">SHANGHAI 2026</h1>
                <p class="text-slate-400 text-[10px] uppercase tracking-[0.2em] font-bold">Urban Lifestyle Guide</p>
            </div>
            <div @click="toggleCurrency()" class="bg-slate-800 px-3 py-1 rounded-full text-[10px] font-bold border border-slate-700 cursor-pointer">
                <span x-text="isTwd ? 'TWD 模式' : 'RMB 模式'"></span>
            </div>
        </div>

        <div class="flex justify-between gap-2">
            <template x-for="(day, index) in itinerary" :key="index">
                <button @click="currentDay = index" 
                    :class="currentDay === index ? 'bg-blue-600 scale-105 shadow-lg' : 'bg-slate-800 opacity-50'"
                    class="flex-1 py-3 rounded-2xl transition-all duration-300">
                    <div class="text-[10px] opacity-70 font-bold">DAY</div>
                    <div class="text-lg font-black" x-text="index + 1"></div>
                </button>
            </template>
        </div>
    </header>

    <main class="p-6 pb-32">
        <div class="mb-8">
            <h2 class="text-2xl font-black text-slate-800" x-text="itinerary[currentDay].title"></h2>
            <p class="text-blue-600 font-bold text-sm" x-text="itinerary[currentDay].date + ' · 質感都市動線'"></p>
        </div>

        <div class="space-y-8 relative">
            <div class="absolute left-4 top-2 bottom-2 w-0.5 bg-slate-200"></div>

            <template x-for="(item, index) in itinerary[currentDay].items" :key="index">
                <div class="relative pl-10">
                    <div class="absolute left-[-2px] top-1 w-4 h-4 bg-white border-4 border-blue-600 rounded-full z-10"></div>
                    
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 active:scale-[0.98] transition-transform">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-lg" x-text="item.time"></span>
                            <i :class="item.icon" class="text-slate-300 text-lg"></i>
                        </div>
                        
                        <h3 class="font-bold text-lg text-slate-800" x-text="item.task"></h3>
                        <div class="flex items-center text-slate-400 text-[11px] mt-1 font-bold">
                            <i class="fa-solid fa-location-dot mr-1"></i> <span x-text="item.loc"></span>
                        </div>

                        <template x-if="item.tip">
                            <div class="mt-4 text-xs text-slate-600 bg-slate-50 p-3 rounded-2xl border-l-4 border-blue-400 leading-relaxed">
                                <span class="font-bold text-blue-600">攻略：</span> <span x-text="item.tip"></span>
                            </div>
                        </template>

                        <template x-if="item.surprise">
                            <div class="mt-4" x-data="{ open: false }">
                                <button @click="open = !open" 
                                    class="w-full py-3 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-2xl text-[11px] font-black shadow-lg shadow-rose-200 uppercase tracking-widest">
                                    <i class="fa-solid fa-gift mr-2 animate-bounce"></i> 解鎖約會驚喜
                                </button>
                                <div x-show="open" x-transition x-cloak class="mt-3 p-4 bg-rose-50 border border-rose-100 rounded-2xl text-xs text-rose-700 font-medium leading-relaxed">
                                    <i class="fa-solid fa-heart mr-1"></i> <span x-text="item.surprise"></span>
                                </div>
                            </div>
                        </template>

                        <div class="mt-4 flex justify-end">
                            <span class="text-[10px] font-black text-slate-300 tracking-tighter" 
                                x-text="isTwd ? '預估：NT$ ' + Math.round(item.cost * 4.5) : '預估：¥ ' + item.cost"></span>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-100 p-4 flex justify-around items-center z-50">
        <div class="flex flex-col items-center text-blue-600">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
            <span class="text-[10px] mt-1 font-bold">行程</span>
        </div>
        <div class="opacity-20 flex flex-col items-center">
            <i class="fa-solid fa-camera-retro text-xl"></i>
            <span class="text-[10px] mt-1 font-bold">街拍</span>
        </div>
        <div class="opacity-20 flex flex-col items-center">
            <i class="fa-solid fa-wallet text-xl"></i>
            <span class="text-[10px] mt-1 font-bold">預算</span>
        </div>
    </footer>

    <script>
        function travelApp() {
            return {
                currentDay: 0,
                isTwd: true,
                toggleCurrency() { this.isTwd = !this.isTwd },
                itinerary: [
                    {
                        date: "5/10", title: "粉色幻想與賽博森林",
                        items: [
                            { time: "15:30", task: "Sanrio Gift Gate", loc: "南京東路旗艦店", icon: "fa-solid fa-heart", cost: 200, tip: "2025新概念店，門口巨型Kitty必拍" },
                            { time: "18:00", task: "蟹尊苑 (蟹黃麵)", loc: "巨鹿路店", icon: "fa-solid fa-bowl-food", cost: 130, tip: "必點蟹粉金拌麵，視覺衝擊極強" },
                            { time: "22:00", task: "INS 復興樂園 (Day A)", loc: "雁蕩路109號", icon: "fa-solid fa-moon", cost: 500, tip: "一站式頂級Club，推薦La Fin看夜景" }
                        ]
                    },
                    {
                        date: "5/11", title: "法式優雅與男團放鬆",
                        items: [
                            { time: "11:00", task: "大壺春生煎", loc: "四川中路", icon: "fa-solid fa-hotdog", cost: 40, tip: "老上海派系，無湯汁底超酥。配一碗牛肉湯是標配" },
                            { time: "13:00", task: "法式現代街拍", loc: "外灘源/虎丘路", icon: "fa-solid fa-camera", cost: 800, tip: "紅磚建築群與三件套同框，質感最高" },
                            { time: "16:30", task: "Speak Low (隱藏酒吧)", loc: "復興中路", icon: <i class="fa-solid fa-martini-glass-citrus"></i>, cost: 200, surprise: "帶她進去買書，推開書架後的機關門進入秘密酒吧，儀式感滿分" },
                            { time: "21:00", task: "GM 瑰冪足道 (Day B)", loc: "淮海中路", icon: "fa-solid fa-spa", cost: 400, tip: "高顏值男技師服務，環境像Lounge Bar，預算友好且質感強" }
                        ]
                    },
                    {
                        date: "5/12", title: "極致 SPA 與 賽博夜景",
                        items: [
                            { time: "14:00", task: "曲水蘭亭 (極致SPA)", loc: "市區店", icon: "fa-solid fa-couch", cost: 1500, tip: "車厘子/哈根達斯自由，完全恢復體力。建議停留5小時以上" },
                            { time: "19:30", task: "北外灘國客中心", loc: "太平路", icon: "fa-solid fa-clapperboard", cost: 0, tip: "找那個巨型銀色球地標，拍陸家嘴三件套最佳位" }
                        ]
                    },
                    {
                        date: "5/13", title: "機場美學歸途",
                        items: [
                            { time: "10:00", task: "出發前往 PVG", loc: "浦東機場", icon: "fa-solid fa-taxi", cost: 150, tip: "預留1小時車程，建議9:30從飯店出發" },
                            { time: "11:00", task: "霸王茶姬 & 星巴克", loc: "機場限定店", icon: "fa-solid fa-mug-hot", cost: 60, tip: "APP先下單！手拿杯在航站樓拍一張「離境感」大片作為結尾" }
                        ]
                    }
                ]
            }
        }
    </script>
</body>
</html>
