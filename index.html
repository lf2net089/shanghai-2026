<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>上海 2026 | 研究強化版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  [x-cloak]{display:none!important}
  body{font-family:'Noto Sans TC',sans-serif;background:#F5F0E8;color:#1A1A2E}
  .serif{font-family:'Playfair Display',serif}
  .ver-nav{background:#1E3A6E;padding:10px 14px;display:flex;align-items:stretch;gap:6px;overflow-x:auto}
  .ver-tab{display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap;padding:8px 14px;border-radius:14px;text-decoration:none;cursor:default;min-width:0;border:1.5px solid transparent}
  .ver-tab.active{background:#F5D789;color:#1E3A6E;border-color:#F5D789}
  .ver-tab:not(.active){background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.15)}
  .ver-tab .vt-title{font-size:12px;font-weight:900;line-height:1.3;letter-spacing:.01em}
  .ver-tab .vt-sub{font-size:9.5px;font-weight:500;opacity:.65;margin-top:2px;line-height:1.3}
  .ver-tab.active .vt-sub{opacity:.55}
  .timeline-line{position:absolute;left:1.0rem;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--dc),var(--dc)40%,#e2e8f0)}
  .tab-pill{padding:8px 18px;border-radius:30px;font-size:12px;font-weight:700;transition:all .2s;border:2px solid transparent;white-space:nowrap}
  .tab-pill.active{background:#1E3A6E;color:#fff;border-color:#1E3A6E;box-shadow:0 4px 12px rgba(30,58,110,.25)}
  .tab-pill:not(.active){background:#fff;color:#64748b;border-color:#e2e8f0}
  .cost-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
  .photo-box{background:rgba(236,72,153,.07);border:1px solid rgba(236,72,153,.25);border-radius:12px;padding:10px 14px;font-size:12px;color:#9d174d}
  .tips-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:10px 14px;font-size:12px;color:#78350f}
  .warn-box{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.25);border-radius:12px;padding:8px 14px;font-size:11px;color:#991b1b}
  .transit-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #e2e8f0;border-radius:30px;padding:5px 12px;font-size:11px;color:#64748b;font-weight:700}
  .section-label{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#94a3b8;margin-bottom:4px}
  .sticky-hdr{position:sticky;top:0;z-index:50;background:rgba(245,240,232,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.07)}
  .card-anim{animation:fadeUp .25s ease}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body x-data="app()" x-cloak>

<!-- VERSION NAV -->
<div class="ver-nav">
  <span class="ver-tab active">
    <span class="vt-title">精準探索</span>
    <span class="vt-sub">核實地址 · 動線最優</span>
  </span>
  <a href="classic.html" class="ver-tab">
    <span class="vt-title">初心全覽</span>
    <span class="vt-sub">完整四天 · 原版企劃</span>
  </a>
  <a href="guide.html" class="ver-tab">
    <span class="vt-title">旅行百科</span>
    <span class="vt-sub">吃買清單 · 一查就懂</span>
  </a>
</div>

<!-- STICKY HEADER -->
<div class="sticky-hdr px-4 py-3">
  <div class="flex items-center justify-between mb-3">
    <div>
      <div class="section-label">上海 2026 · 5/10–5/13</div>
      <h1 class="serif text-xl font-black text-slate-900 leading-tight">研究強化版</h1>
    </div>
    <button @click="isTwd=!isTwd"
      class="text-xs font-black px-3 py-1.5 rounded-full bg-slate-800 text-white flex-shrink-0">
      <span x-text="isTwd?'🇹🇼 TWD':'🇨🇳 RMB'"></span>
    </button>
  </div>
  <div class="flex gap-2 overflow-x-auto pb-1">
    <template x-for="(day,i) in days" :key="i">
      <button @click="currentDay=i" :class="currentDay===i?'active':''"
        class="tab-pill flex-shrink-0"
        x-text="'D'+(i+1)+' · '+day.shortDate"></button>
    </template>
  </div>
</div>

<main class="px-4 pt-4 pb-28 max-w-lg mx-auto">

<!-- ── 四天快速預覽 ── -->
<div class="mb-5">
  <div class="text-xs font-black text-slate-400 tracking-widest uppercase mb-2.5">四天行程一覽</div>
  <div class="flex gap-2 overflow-x-auto pb-1" style="scrollbar-width:none;-webkit-overflow-scrolling:touch">
    <template x-for="(day,i) in days" :key="i">
      <div @click="currentDay=i;window.scrollTo({top:0,behavior:'smooth'})"
        class="flex-shrink-0 rounded-2xl p-3.5 cursor-pointer transition-all"
        style="width:112px"
        :style="currentDay===i
          ?'background:'+day.dotColor+';box-shadow:0 6px 20px '+day.dotColor+'40'
          :'background:#fff;border:1.5px solid #e2e8f0'">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xl" x-text="day.emoji"></span>
          <span class="text-xs font-black rounded-full px-2 py-0.5"
            :style="currentDay===i?'background:rgba(255,255,255,.25);color:#fff':'background:#f1f5f9;color:#94a3b8'"
            x-text="'Day '+(i+1)"></span>
        </div>
        <div class="text-xs font-black leading-snug mb-1.5"
          :class="currentDay===i?'text-white':'text-slate-800'" x-text="day.title"></div>
        <div class="text-xs leading-snug mb-2"
          :class="currentDay===i?'text-white opacity-70':'text-slate-400'" x-text="day.subtitle"></div>
        <div class="flex flex-wrap gap-1">
          <template x-for="tag in day.tags.slice(0,2)" :key="tag">
            <span class="text-xs px-1.5 py-0.5 rounded-full font-bold"
              :style="currentDay===i?'background:rgba(255,255,255,.2);color:#fff':'background:#f8fafc;color:#64748b;border:1px solid #e2e8f0'"
              x-text="tag"></span>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>

<template x-for="(day,i) in days" :key="i">
<div x-show="currentDay===i" class="card-anim" :style="'--dc:'+day.dotColor">

  <!-- Day Cover -->
  <div class="rounded-2xl mb-4 overflow-hidden" :style="'background:'+day.coverGrad">
    <div class="p-5 text-white">
      <div class="flex items-start justify-between">
        <div>
          <div class="text-3xl mb-2" x-text="day.emoji"></div>
          <div class="text-xs font-black uppercase tracking-widest opacity-60 mb-1"
            x-text="day.shortDate+' · Day '+(i+1)"></div>
          <h2 class="serif text-2xl font-black leading-tight" x-text="day.title"></h2>
          <p class="text-sm opacity-70 mt-1" x-text="day.subtitle"></p>
        </div>
        <div class="text-right flex-shrink-0 ml-3">
          <div class="text-xs opacity-50 mb-0.5">兩人預算</div>
          <div class="font-black text-base" x-text="isTwd?day.budgetTwd:day.budgetRmb"></div>
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-4">
        <template x-for="tag in day.tags" :key="tag">
          <span class="text-xs font-bold bg-white bg-opacity-20 px-2.5 py-1 rounded-full" x-text="tag"></span>
        </template>
      </div>
    </div>
  </div>

  <!-- 3-col highlights -->
  <div class="grid grid-cols-3 gap-2 mb-5">
    <template x-for="hl in day.highlights" :key="hl.label">
      <div class="bg-white rounded-2xl p-3 text-center shadow-sm border border-slate-100">
        <div class="text-xl mb-1" x-text="hl.icon"></div>
        <div class="text-xs font-black text-slate-700 leading-tight" x-text="hl.label"></div>
        <div class="text-xs text-slate-400 mt-0.5" x-text="hl.val"></div>
      </div>
    </template>
  </div>

  <!-- Timeline -->
  <div class="relative" style="padding-left:2.4rem">
    <div class="timeline-line"></div>

    <template x-for="(item,j) in day.items" :key="j">
    <div>
      <!-- Dot -->
      <div class="absolute rounded-full bg-white border-4 z-10 shadow-sm"
        :style="'left:.55rem;top:'+(j===0?'1.5':'0')+'rem;width:16px;height:16px;border-color:'+day.dotColor"
        style="position:absolute"></div>

      <!-- Time label -->
      <div class="text-xs font-black mb-1" :style="'color:'+day.dotColor" x-text="item.time"
        :class="j===0?'':'mt-1'"></div>

      <!-- Activity Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden mb-1"
        x-data="{open:false}" @click="open=!open">
        <div class="p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-start gap-3 flex-1 min-w-0">
              <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 text-sm"
                :style="'background:'+day.dotColor+'18'">
                <i :class="'fa-solid '+item.icon" :style="'color:'+day.dotColor"></i>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="font-black text-sm text-slate-800 leading-snug" x-text="item.task"></h3>
                <div class="flex items-center text-slate-400 text-xs mt-0.5 gap-1">
                  <i class="fa-solid fa-location-dot flex-shrink-0"></i>
                  <span class="truncate" x-text="item.loc"></span>
                </div>
              </div>
            </div>
            <div class="flex flex-col items-end gap-1.5 flex-shrink-0">
              <span class="cost-chip text-white" :style="'background:'+day.dotColor"
                x-text="item.cost>0?(isTwd?'NT$'+Math.round(item.cost*4.64):'¥'+item.cost):'免費'"></span>
              <i class="fa-solid fa-chevron-down text-slate-300 text-xs transition-transform duration-200"
                :class="open?'rotate-180':''"></i>
            </div>
          </div>
        </div>

        <!-- Expanded -->
        <div x-show="open" x-transition x-cloak
          class="px-4 pb-4 border-t border-slate-50 pt-3 space-y-2">
          <template x-if="item.tip">
            <div class="tips-box">
              <div class="font-black text-xs mb-1 text-amber-700">💡 攻略</div>
              <div x-text="item.tip"></div>
            </div>
          </template>
          <template x-if="item.photo">
            <div class="photo-box">
              <div class="font-black text-xs mb-1">📸 拍照亮點</div>
              <div x-text="item.photo"></div>
            </div>
          </template>
          <template x-if="item.warning">
            <div class="warn-box flex gap-2 items-start">
              <i class="fa-solid fa-triangle-exclamation mt-0.5 flex-shrink-0"></i>
              <span x-text="item.warning"></span>
            </div>
          </template>
          <template x-if="item.surprise">
            <div x-data="{show:false}">
              <button @click.stop="show=!show"
                class="w-full py-2.5 rounded-xl text-xs font-black tracking-wider bg-gradient-to-r from-rose-500 to-pink-400 text-white shadow-md">
                <i class="fa-solid fa-gift mr-1"></i>解鎖約會驚喜
              </button>
              <div x-show="show" x-cloak
                class="mt-2 bg-rose-50 border border-rose-100 rounded-xl p-3 text-xs text-rose-700">
                <i class="fa-solid fa-heart mr-1 text-rose-400"></i><span x-text="item.surprise"></span>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- ── Transit Connector ── -->
      <template x-if="item.moveTo">
        <div class="flex items-start gap-2 py-1 mb-2">
          <div class="flex flex-col items-center pt-1 flex-shrink-0" style="width:1.5rem">
            <div class="w-px h-2 bg-slate-200"></div>
            <i class="fa-solid fa-arrow-down text-slate-300" style="font-size:7px"></i>
            <div class="w-px h-2 bg-slate-200"></div>
          </div>
          <div class="flex-1">
            <div class="transit-chip">
              <span x-text="item.moveTo.emoji"></span>
              <span x-text="item.moveTo.line"></span>
              <span class="text-slate-300">·</span>
              <span class="text-slate-700" x-text="item.moveTo.duration"></span>
              <template x-if="item.moveTo.cost>0">
                <span x-text="'· '+(isTwd?'NT$'+Math.round(item.moveTo.cost*4.64):'~¥'+item.moveTo.cost)"></span>
              </template>
            </div>
          </div>
        </div>
      </template>

    </div>
    </template>
  </div>

  <!-- Day summary -->
  <div class="rounded-2xl p-4 mt-1 mb-6"
    :style="'background:'+day.dotColor+'10;border:1.5px solid '+day.dotColor+'28'">
    <div class="text-xs font-black mb-1" :style="'color:'+day.dotColor">✦ 今日主軸</div>
    <p class="text-sm text-slate-600 leading-relaxed" x-text="day.summary"></p>
  </div>

</div>
</template>

<!-- Checklist -->
<div class="section-label mt-6 mb-3">出發前清單</div>
<div class="bg-white rounded-2xl shadow-sm p-5 mb-4 border border-slate-100" x-data="checklist()">
  <div class="flex items-center justify-between mb-3">
    <h3 class="font-black text-slate-800 text-sm">必備核對</h3>
    <span class="text-xs font-black text-white px-3 py-1 rounded-full bg-slate-700"
      x-text="done+'/'+total+' ✓'"></span>
  </div>
  <div class="h-1.5 bg-slate-100 rounded-full mb-4 overflow-hidden">
    <div class="h-full bg-gradient-to-r from-rose-500 to-amber-400 rounded-full transition-all"
      :style="'width:'+pct+'%'"></div>
  </div>
  <div class="space-y-1">
    <template x-for="(it,i) in items" :key="i">
      <label class="flex items-start gap-3 p-2.5 rounded-xl cursor-pointer hover:bg-slate-50"
        :class="it.checked?'opacity-50':''">
        <input type="checkbox" x-model="it.checked" @change="calc()"
          class="mt-0.5 w-4 h-4 accent-rose-500 flex-shrink-0">
        <div>
          <div class="text-sm font-bold" :class="it.checked?'line-through text-slate-400':'text-slate-700'"
            x-text="it.label"></div>
          <div class="text-xs text-slate-400" x-text="it.note" x-show="it.note"></div>
        </div>
      </label>
    </template>
  </div>
</div>

<!-- Budget -->
<div class="section-label mb-3">預算總表</div>
<div class="bg-white rounded-2xl shadow-sm p-5 mb-8 border border-slate-100" x-data="{tw:false}">
  <div class="flex justify-between items-center mb-4">
    <h3 class="font-black text-slate-800 text-sm">兩人費用估算</h3>
    <button @click="tw=!tw" class="text-xs font-black px-3 py-1 rounded-full bg-slate-700 text-white">
      <span x-text="tw?'🇹🇼 TWD':'🇨🇳 RMB'"></span>
    </button>
  </div>
  <template x-for="r in budget" :key="r.label">
    <div class="flex items-center justify-between py-2.5"
      :class="r.total?'border-t-2 border-amber-300 mt-2':'border-b border-slate-50'">
      <div class="flex items-center gap-2 text-sm">
        <span x-text="r.icon"></span>
        <span :class="r.total?'font-black text-slate-800':'text-slate-600'" x-text="r.label"></span>
      </div>
      <span class="font-black" :class="r.total?'text-rose-600 text-base':'text-slate-700 text-sm'"
        x-text="tw?r.twd:r.rmb"></span>
    </div>
  </template>
</div>

</main>

<!-- Bottom nav -->
<div class="fixed bottom-0 left-0 right-0 z-40 pointer-events-none">
  <div class="max-w-lg mx-auto px-4 pb-5 pt-3 bg-gradient-to-t from-[#F5F0E8] via-[#F5F0E8]/90 to-transparent pointer-events-auto">
    <div class="flex gap-2">
      <template x-for="(day,i) in days" :key="i">
        <button @click="currentDay=i;window.scrollTo({top:0,behavior:'smooth'})"
          class="flex-1 py-2.5 rounded-2xl text-xs font-black transition-all shadow-sm"
          :class="currentDay===i?'text-white shadow-md':'bg-white text-slate-400 border border-slate-100'"
          :style="currentDay===i?'background:'+day.dotColor:''">
          <div class="text-base leading-none mb-0.5" x-text="day.emoji"></div>
          <div x-text="'D'+(i+1)"></div>
        </button>
      </template>
    </div>
  </div>
</div>

<script>
function app(){
  return {
    currentDay:0, isTwd:false,
    budget:[
      {icon:'🏨',label:'住宿 3晚',rmb:'¥900–1,200',twd:'NT$4,176–5,568',total:false},

      {icon:'🛍️',label:'購物（Sanrio等）',rmb:'¥300–1,000',twd:'NT$1,392–4,640',total:false},

           moveTo:{emoji:'🚕',line:'滴滴 or 步行 → 外灘',duration:'15–20分鐘',cost:18}},
