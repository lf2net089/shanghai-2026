<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>上海 2026 | 質感旅遊攻略</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  [x-cloak]{display:none!important}
  body{font-family:'Noto Sans TC',sans-serif;background:#F5F0E8;color:#1A1A2E}
  .serif{font-family:'Playfair Display',serif}
  .ver-bar{background:#1E3A6E;color:#fff;font-size:11px;text-align:center;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:12px}
  .ver-bar a{color:#F5D789;text-decoration:none;font-weight:700;border:1px solid rgba(245,215,137,.5);border-radius:20px;padding:2px 10px}
  .day-cover{position:relative;overflow:hidden;border-radius:20px;margin-bottom:24px}
  .day-cover-bg{position:absolute;inset:0;opacity:.12}
  .timeline-line{position:absolute;left:20px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#C94B3D,#D4A843,#1E3A6E)}
  .cat-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:20px}
  .card-enter{animation:slideUp .3s ease forwards}
  @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .tag-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.06)}
  .cost-chip{font-family:'Noto Sans TC',monospace;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
  .photo-box{background:linear-gradient(135deg,rgba(255,107,157,.08),rgba(255,107,157,.03));border:1px solid rgba(255,107,157,.25);border-radius:12px;padding:10px 14px;font-size:12px;color:#c94b7d}
  .tips-box{background:linear-gradient(135deg,rgba(212,168,67,.1),rgba(212,168,67,.04));border:1px solid rgba(212,168,67,.35);border-radius:12px;padding:10px 14px;font-size:12px;color:#92700A}
  .surprise-box{background:linear-gradient(135deg,rgba(201,75,61,.08),rgba(201,75,61,.03));border:1px solid rgba(201,75,61,.25);border-radius:12px;padding:12px 14px;font-size:12px;color:#7A2118}
  .tab-pill{padding:8px 18px;border-radius:30px;font-size:12px;font-weight:700;transition:all .2s;border:2px solid transparent;white-space:nowrap}
  .tab-pill.active{background:#1E3A6E;color:#fff;border-color:#1E3A6E;box-shadow:0 4px 12px rgba(30,58,110,.25)}
  .tab-pill:not(.active){background:#fff;color:#1E3A6E;border-color:#ddd}
  .overview-card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);transition:all .2s;border:2px solid transparent;cursor:pointer}
  .overview-card.active{border-color:#C94B3D;box-shadow:0 4px 20px rgba(201,75,61,.2)}
  .section-label{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#999;margin-bottom:6px}
  .sticky-header{position:sticky;top:0;z-index:50;background:rgba(245,240,232,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.08)}
</style>
</head>
<body x-data="app()" x-cloak>

<!-- VERSION SWITCHER -->
<div class="ver-bar">
  <span>🔬 研究強化版 V2 · 行程已依 Deep Research 優化</span>
  <a href="classic.html">切換 V1 原始版 →</a>
</div>

<!-- STICKY HEADER -->
<div class="sticky-header px-4 py-3">
  <div class="flex items-center justify-between mb-3">
    <div>
      <div class="section-label">Shanghai 2026</div>
      <h1 class="serif text-xl font-black text-slate-900 leading-tight">質感都市完整攻略</h1>
    </div>
    <div class="flex items-center gap-2">
      <button @click="toggleCurrency()"
        class="text-xs font-black px-3 py-1.5 rounded-full border-2 border-slate-800 bg-slate-800 text-white">
        <span x-text="isTwd ? '🇹🇼 TWD' : '🇨🇳 RMB'"></span>
      </button>
    </div>
  </div>
  <!-- Day Tabs -->
  <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
    <template x-for="(day, i) in days" :key="i">
      <button @click="currentDay=i"
        :class="currentDay===i ? 'active' : ''"
        class="tab-pill flex-shrink-0"
        x-text="'Day '+(i+1)+' · '+day.shortDate"></button>
    </template>
  </div>
</div>

<!-- MAIN -->
<main class="px-4 pt-5 pb-28 max-w-lg mx-auto">

  <!-- DAY COVER -->
  <template x-for="(day, i) in days" :key="i">
    <div x-show="currentDay===i" class="card-enter">

      <!-- Cover Card -->
      <div class="day-cover mb-5" :style="'background:'+day.coverGrad">
        <div class="relative p-5 text-white">
          <div class="flex items-start justify-between">
            <div>
              <div class="text-3xl mb-2" x-text="day.emoji"></div>
              <div class="text-xs font-black uppercase tracking-widest opacity-70 mb-1" x-text="day.shortDate+' · Day '+(i+1)"></div>
              <h2 class="serif text-2xl font-black leading-tight" x-text="day.title"></h2>
              <p class="text-sm opacity-75 mt-1" x-text="day.subtitle"></p>
            </div>
            <div class="text-right flex-shrink-0">
              <div class="text-xs opacity-60 mb-1">預算/兩人</div>
              <div class="font-black text-sm" x-text="isTwd ? day.budgetTwd : day.budgetRmb"></div>
            </div>
          </div>
          <!-- Tags -->
          <div class="flex flex-wrap gap-1.5 mt-4">
            <template x-for="tag in day.tags" :key="tag">
              <span class="text-xs font-bold bg-white bg-opacity-20 px-2.5 py-1 rounded-full" x-text="tag"></span>
            </template>
          </div>
        </div>
      </div>

      <!-- Overview Highlights -->
      <div class="grid grid-cols-3 gap-2 mb-5">
        <template x-for="hl in day.highlights" :key="hl.label">
          <div class="bg-white rounded-2xl p-3 text-center shadow-sm">
            <div class="text-lg mb-1" x-text="hl.icon"></div>
            <div class="text-xs font-black text-slate-700 leading-tight" x-text="hl.label"></div>
            <div class="text-xs text-slate-400 mt-0.5" x-text="hl.val"></div>
          </div>
        </template>
      </div>

      <!-- Timeline -->
      <div class="relative pl-10" style="padding-left:2.5rem">
        <div class="timeline-line" style="left:1.0rem"></div>

        <template x-for="(item, j) in day.items" :key="j">
          <div class="relative mb-5">
            <!-- Dot -->
            <div class="absolute bg-white border-4 rounded-full z-10 shadow"
              :style="'left:-1.55rem;top:1rem;width:18px;height:18px;border-color:'+day.dotColor"></div>

            <!-- Time chip -->
            <div class="text-xs font-black mb-1.5" :style="'color:'+day.dotColor" x-text="item.time"></div>

            <!-- Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden"
              x-data="{open:false}" @click="open=!open">
              <div class="p-4">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-start gap-3 flex-1">
                    <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 text-base"
                      :style="'background:'+day.dotColor+'18'">
                      <i :class="'fa-solid '+item.icon" :style="'color:'+day.dotColor"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <h3 class="font-black text-sm text-slate-800 leading-tight" x-text="item.task"></h3>
                      <div class="flex items-center text-slate-400 text-xs mt-0.5 gap-1">
                        <i class="fa-solid fa-location-dot text-xs"></i>
                        <span class="truncate" x-text="item.loc"></span>
                      </div>
                    </div>
                  </div>
                  <div class="flex flex-col items-end gap-1.5 flex-shrink-0">
                    <span class="cost-chip text-white" :style="'background:'+day.dotColor"
                      x-text="item.cost>0 ? (isTwd ? 'NT$'+Math.round(item.cost*4.64) : '¥'+item.cost) : '免費'"></span>
                    <i class="fa-solid fa-chevron-down text-slate-300 text-xs transition-transform duration-200"
                      :class="open ? 'rotate-180' : ''"></i>
                  </div>
                </div>
              </div>

              <!-- Expanded Detail -->
              <div x-show="open" x-transition:enter="transition ease-out duration-200"
                x-transition:enter-start="opacity-0 -translate-y-2"
                x-transition:enter-end="opacity-100 translate-y-0" x-cloak
                class="px-4 pb-4 border-t border-slate-50 pt-3 space-y-2">

                <template x-if="item.tip">
                  <div class="tips-box">
                    <div class="font-black text-xs mb-1 text-amber-700">💡 攻略</div>
                    <div x-text="item.tip"></div>
                  </div>
                </template>

                <template x-if="item.photo">
                  <div class="photo-box">
                    <div class="font-black text-xs mb-1">📸 拍照亮點</div>
                    <div x-text="item.photo"></div>
                  </div>
                </template>

                <template x-if="item.surprise">
                  <div x-data="{show:false}">
                    <button @click.stop="show=!show"
                      class="w-full py-2.5 bg-gradient-to-r from-rose-500 to-pink-500 text-white rounded-xl text-xs font-black shadow-md tracking-widest uppercase">
                      <i class="fa-solid fa-gift mr-1"></i> 解鎖約會驚喜
                    </button>
                    <div x-show="show" x-cloak class="surprise-box mt-2">
                      <i class="fa-solid fa-heart mr-1 text-rose-400"></i>
                      <span x-text="item.surprise"></span>
                    </div>
                  </div>
                </template>

                <template x-if="item.transport">
                  <div class="flex items-center gap-2 text-xs text-slate-500 bg-slate-50 rounded-xl px-3 py-2">
                    <i class="fa-solid fa-route text-slate-400"></i>
                    <span x-text="item.transport"></span>
                  </div>
                </template>

                <template x-if="item.warning">
                  <div class="bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-xs text-amber-800">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                    <span x-text="item.warning"></span>
                  </div>
                </template>

              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- Day Summary Box -->
      <div class="rounded-2xl p-4 mt-2 mb-6" :style="'background:'+day.dotColor+'12;border:1.5px solid '+day.dotColor+'30'">
        <div class="text-xs font-black mb-1" :style="'color:'+day.dotColor">✦ 今日主軸</div>
        <p class="text-sm text-slate-700 leading-relaxed" x-text="day.summary"></p>
      </div>

    </div>
  </template>

  <!-- QUICK REFS -->
  <div class="mt-8 mb-4">
    <div class="section-label">快速參考</div>
    <h2 class="serif text-xl font-black text-slate-900 mb-4">旅行裝備清單</h2>
  </div>

  <!-- Checklist -->
  <div class="bg-white rounded-2xl shadow-sm p-5 mb-4" x-data="checklist()">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-black text-slate-800">出發前必備</h3>
      <span class="text-xs font-black text-white px-3 py-1 rounded-full bg-slate-700"
        x-text="done+'/'+total+' 完成'"></span>
    </div>
    <div class="h-1.5 bg-slate-100 rounded-full mb-4 overflow-hidden">
      <div class="h-full bg-gradient-to-r from-rose-500 to-amber-400 rounded-full transition-all duration-500"
        :style="'width:'+pct+'%'"></div>
    </div>
    <div class="space-y-2">
      <template x-for="(item, i) in items" :key="i">
        <label class="flex items-start gap-3 p-3 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors"
          :class="item.checked ? 'opacity-50' : ''">
          <input type="checkbox" x-model="item.checked" @change="calc()"
            class="mt-0.5 w-4 h-4 accent-rose-500 flex-shrink-0 cursor-pointer">
          <div>
            <div class="text-sm font-bold text-slate-700" :class="item.checked ? 'line-through' : ''" x-text="item.label"></div>
            <div class="text-xs text-slate-400" x-text="item.note" x-show="item.note"></div>
          </div>
        </label>
      </template>
    </div>
  </div>

  <!-- Budget Table -->
  <div class="bg-white rounded-2xl shadow-sm p-5 mb-4">
    <h3 class="font-black text-slate-800 mb-4">💰 預算總表（兩人）</h3>
    <div class="space-y-2" x-data="{twd:false}">
      <div class="flex justify-end mb-2">
        <button @click="twd=!twd" class="text-xs font-black px-3 py-1 rounded-full bg-slate-800 text-white">
          <span x-text="twd ? '🇹🇼 TWD' : '🇨🇳 RMB'"></span>
        </button>
      </div>
      <template x-for="row in budget" :key="row.label">
        <div class="flex items-center justify-between py-2 border-b border-slate-50">
          <div class="flex items-center gap-2">
            <span x-text="row.icon"></span>
            <span class="text-sm text-slate-700" x-text="row.label"></span>
          </div>
          <span class="font-black text-sm" x-text="twd ? row.twd : row.rmb"
            :class="row.total ? 'text-rose-600 text-base' : 'text-slate-700'"></span>
        </div>
      </template>
    </div>
  </div>

  <!-- Key Contacts -->
  <div class="bg-white rounded-2xl shadow-sm p-5 mb-4">
    <h3 class="font-black text-slate-800 mb-3">📞 緊急資訊</h3>
    <div class="space-y-2 text-sm">
      <div class="flex justify-between py-1.5 border-b border-slate-50">
        <span class="text-slate-500">台灣駐滬辦事處</span>
        <span class="font-bold">+86-21-5292-5567</span>
      </div>
      <div class="flex justify-between py-1.5 border-b border-slate-50">
        <span class="text-slate-500">錦江之星飯店</span>
        <span class="font-bold">+86-21-6327-5888</span>
      </div>
      <div class="flex justify-between py-1.5 border-b border-slate-50">
        <span class="text-slate-500">GM芳華 (預約)</span>
        <span class="font-bold">普安路1609號</span>
      </div>
      <div class="flex justify-between py-1.5">
        <span class="text-slate-500">INS新仙鶴</span>
        <span class="font-bold">蘇州河路109號</span>
      </div>
    </div>
  </div>

  <!-- Footer note -->
  <div class="text-center mt-8 pb-4">
    <p class="serif text-lg font-black text-slate-400 italic">Bon voyage ✦</p>
    <p class="text-xs text-slate-300 mt-1">上海 2026 · 5/10–5/13 · 1 CNY ≈ NT$4.64</p>
  </div>

</main>

<!-- BOTTOM NAV OVERLAY -->
<div class="fixed bottom-0 left-0 right-0 z-40">
  <div class="max-w-lg mx-auto px-4 pb-6 pt-3 bg-gradient-to-t from-[#F5F0E8] via-[#F5F0E8]/95 to-transparent">
    <div class="flex gap-2">
      <template x-for="(day, i) in days" :key="i">
        <button @click="currentDay=i;scrollTop()"
          class="flex-1 py-3 rounded-2xl text-xs font-black transition-all duration-200 shadow-sm"
          :class="currentDay===i ? 'text-white shadow-lg' : 'bg-white text-slate-500'"
          :style="currentDay===i ? 'background:'+day.dotColor : ''">
          <div class="text-base" x-text="day.emoji"></div>
          <div x-text="'D'+(i+1)"></div>
        </button>
      </template>
    </div>
  </div>
</div>

<script>
function app(){
  return {
    currentDay: 0,
    isTwd: false,
    budget: [
      {icon:'🏨', label:'住宿 3晚', rmb:'¥900–1,200', twd:'NT$4,176–5,568', total:false},
      {icon:'🍽️', label:'餐飲（全程）', rmb:'¥2,200–3,200', twd:'NT$10,208–14,848', total:false},
      {icon:'🚕', label:'交通（滴滴+地鐵）', rmb:'¥350–500', twd:'NT$1,624–2,320', total:false},
      {icon:'🎟️', label:'景點&體驗', rmb:'¥100–200', twd:'NT$464–928', total:false},
      {icon:'🎶', label:'夜生活 2晚', rmb:'¥820–1,100', twd:'NT$3,805–5,104', total:false},
      {icon:'🛍️', label:'購物（Sanrio等）', rmb:'¥500–1,500', twd:'NT$2,320–6,960', total:false},
      {icon:'💎', label:'兩人總計', rmb:'¥4,870–7,700', twd:'NT$22,597–35,728', total:true},
    ],
    toggleCurrency(){ this.isTwd = !this.isTwd },
    scrollTop(){ window.scrollTo({top:0,behavior:'smooth'}) },
    days: [
      {
        emoji:'✈️', shortDate:'5/10 週六',
        title:'抵達 · 感官校準',
        subtitle:'外灘日落 · Sanrio · INS首秀',
        coverGrad:'linear-gradient(135deg,#C94B3D,#E85D35,#D4A843)',
        dotColor:'#C94B3D',
        budgetRmb:'¥900–1,250',budgetTwd:'NT$4,176–5,800',
        tags:['外灘','Sanrio','INS夜店','大壺春'],
        summary:'這一天的邏輯是「從輕到重」：午餐清爽落地，Sanrio感受溫度，外灘找到這座城市的呼吸節奏，再用 INS 的氛圍把兩個人切換到城市夜晚模式。',
        highlights:[
          {icon:'🥟', label:'裕興記', val:'¥104/人'},
          {icon:'🎀', label:'Sanrio', val:'安彩匯1F'},
          {icon:'🎶', label:'INS', val:'蘇州河路109'},
        ],
        items:[
          {time:'10:00–12:00', task:'PVG 抵達 · 入住', loc:'錦江之星 人民廣場', icon:'fa-plane-arrival', cost:0,
           tip:'建議滴滴直達，行李多時更省心。大木橋路站→PVG 約 34 分鐘（不含步行），實際保留 45–60 分鐘。',
           transport:'滴滴 PVG → 飯店 約 ¥150–200 / 50–70 分鐘'},
          {time:'12:30–14:00', task:'裕興記 蹦蹦魚面館', loc:'人民廣場店', icon:'fa-bowl-rice', cost:208,
           tip:'人均約 ¥104，抵達後第一餐穩且好吃。避開 12:00–13:30 尖峰，14:00 後從容入座。',
           warning:'排隊尖峰為 12:00–13:30，建議 14:00 後前往'},
          {time:'14:15–15:30', task:'Sanrio Gift Gate', loc:'京安路299號 安彩匯廣場 1F S-103', icon:'fa-gift', cost:300,
           tip:'正式核實地址：京安路299號安彩匯廣場 1F S-103，就在人民廣場附近，步行可達。10:00–22:00。平日下午人流最佳。',
           photo:'入口 IP 裝置合照、購物袋道具、每個主題角落角度',
           surprise:'走進去的瞬間，輕聲說：「這裡好像你。」記得看她的眼神。'},
          {time:'15:45–19:30', task:'外灘 · 黃浦江日落散步', loc:'南京路步行街 → 外灘堤防', icon:'fa-water', cost:0,
           tip:'日落時段（17:30–18:30）光線最強烈，浦江+陸家嘴全景。步行從安彩匯過去約 20 分鐘，或滴滴 10 分鐘。',
           photo:'外灘堤防正面對岸陸家嘴、南京路路口建築立面、黃浦江倒影'},
          {time:'20:00–21:00', task:'大壺春 · 米其林 Bib Gourmand', loc:'四川中路店（外灘附近）', icon:'fa-utensils', cost:56,
           tip:'人均 ¥28，Bib Gourmand 認證。生煎配辣醬油是上海的味道密碼。外灘步行可達，不需排很久。'},
          {time:'22:00–01:00', task:'INS新仙鶴 / La Fin · 夜生活Day A', loc:'蘇州河路109號', icon:'fa-music', cost:333,
           tip:'週日（5/10）Klook 有方案 NT$773/人，建議出發前 3–5 天購買確認 lineup。La Fin 定位 upscale hip hop / Top 40。Dress code: Smart Casual（男：長褲+乾淨球鞋，女：洋裝+長褲皆可）。',
           warning:'出發前 3–5 天再次確認 lineup 與 guest list 政策',
           surprise:'在回飯店的路上，問她今晚最喜歡哪個瞬間。'},
        ]
      },
      {
        emoji:'📷', shortDate:'5/11 週一',
        title:'質感漫遊 · 法租界緩行',
        subtitle:'武康大樓 · 本幫佳餚 · 新天地',
        coverGrad:'linear-gradient(135deg,#1E3A6E,#2E5BA8,#4A90D9)',
        dotColor:'#1E3A6E',
        budgetRmb:'¥850–1,650',budgetTwd:'NT$3,944–7,656',
        tags:['武康大樓','人和館','新天地','城市漫步'],
